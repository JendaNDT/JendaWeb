name: Publish Skoda Racer 1.19.0
on:
  push:
    branches: [publication/skoda-racer-1.19.0]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 5
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/binaries/*
            /binaries/skoda-racer-1.19.0/
            !/lost-signal/releases/
            !/screenshots/
            !/rt-asistent/
            !/splash/
            !/artwork/
      - name: Download and verify release assets
        run: |
          curl -fsSL --retry 3 https://github.com/JendaNDT/-kodaRacer/releases/download/testovaci-build/SkodaRacer.apk -o /tmp/SkodaRacer.apk
          curl -fsSL --retry 3 https://github.com/JendaNDT/-kodaRacer/releases/download/testovaci-build/SkodaRacer.exe -o /tmp/SkodaRacer.exe
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil
          dest=Path('binaries/skoda-racer-1.19.0')
          manifest=json.loads((dest/'manifest.json').read_text())
          for file in manifest['files']:
              data=(Path('/tmp')/file['name']).read_bytes()
              assert len(data)==file['bytes'] and hashlib.sha256(data).hexdigest()==file['sha256'],file['name']
              if not file['parts']:
                  shutil.copyfile(Path('/tmp')/file['name'],dest/file['name'])
              offset=0
              for part in file['parts']:
                  chunk=data[offset:offset+part['bytes']]
                  assert hashlib.sha256(chunk).hexdigest()==part['sha256'],part['name']
                  (dest/part['name']).write_bytes(chunk)
                  offset+=part['bytes']
              if file['parts']: assert offset==len(data)
          PY
      - name: Verify website build and downloads
        run: |
          node build_site.cjs
          node build_site.cjs --check
          node tests/startup-build.cjs
          node tests/download-counts.cjs
      - name: Publish verified files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binaries/skoda-racer-1.19.0/
          git rm .github/workflows/publish-skoda-119.yml
          git commit -m "Publish verified Skoda Racer 1.19.0 Android and Windows binaries"
          git push origin HEAD:main
